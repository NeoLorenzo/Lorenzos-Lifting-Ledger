<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Lorenzo's Lifting Ledger" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=4" />
    <title>Lorenzo's Lifting Ledger</title>
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <section id="loading" class="card">
        <p>Loading…</p>
      </section>

      <section id="signed-out" class="card" hidden>
        <button id="google-sign-in" class="google-button" type="button">
          <span class="google-mark" aria-hidden="true">G</span>
          Continue with Google
        </button>
        <p id="auth-error" class="error" role="alert" hidden></p>
      </section>

      <section id="signed-in" class="card" hidden>
        <header class="data-header">
          <div>
            <h1>Your lifts</h1>
            <p id="dataset-status">Loading your data…</p>
          </div>
          <button id="sign-out" class="link-button" type="button">Sign out</button>
        </header>
        <section class="catalogue-panel" aria-labelledby="exercise-catalogue-heading">
          <h2 id="exercise-catalogue-heading">Exercise catalogue</h2>
          <p id="exercise-status">Loading your exercises…</p>
          <ol id="exercise-catalogue" class="catalogue-list"></ol>
        </section>
        <h2 class="history-heading">Workout history</h2>
        <ol id="lift-list" class="lift-list"></ol>
        <button id="load-more" class="load-more" type="button" hidden>Load more</button>
      </section>
    </main>

    <script type="module" src="./app.js?v=5"></script>
  </body>
</html>
